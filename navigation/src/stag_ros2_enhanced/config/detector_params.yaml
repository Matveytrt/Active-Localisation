# STag Detector Node Parameters (legacy / generic template).
# Canonical configs for this project: config/detector_params_HD15.yaml and
# config/detector_params_HD17.yaml (topics, marker_frame_prefix, optical child frame).

/**:
  ros__parameters:
    
    # ===== Image Topics =====
    image_topic: "/torso_rgbd/image_raw"
    camera_info_topic: "/torso_rgbd/camera_info"
    
    # ===== Detection Parameters =====
    # Marker type: HD17, HG13, HC21, HO17, etc.
    marker_type: 'HD15'
    
    # Error correction level (-1 for auto/maximum)
    error_correction: -1
    
    # Proximity threshold for HC marker centroid matching (pixels)
    # Only used for HC markers - determines maximum distance between channel detections
    proximity_threshold: 10.0
    
    # ===== Marker Physical Properties =====
    # Marker size in meters (required only for TF broadcasting and visualization labels)
    # Set to 0.0 if not needed (detection works without it)
    marker_size: 0.08
    
    # ===== Visualization =====
    # Publish detection visualization image
    show_detection: true
    
    # Topic for detection visualization
    detection_image_topic: '~/detection_image'
    
    # Show rejected marker candidates in visualization
    show_rejected: true
    
    # ===== TF Broadcasting =====
    # Enable TF broadcasting for detected markers (requires marker_size > 0 and camera_info)
    # Requires correct camera_info and marker_size; enabled because the simulation camera is ideal
    publish_tf: true
    
    # Camera frame for TF parent
    camera_frame: "torso_rgbd"
    
    # Prefix for marker frame names (e.g., stag_marker_0, stag_marker_1)
    marker_frame_prefix: 'stag_marker_'
    
    # ===== Marker Tracking =====
    # Enable marker tracking for stable detections
    enable_marker_tracking: true
    
    # Distance threshold for duplicate detection filtering (pixels)
    tracking_distance_threshold: 10.0
    
    # Timeout for marker detection history (seconds)
    tracking_timeout: 0.5
    
    # ===== Statistics =====
    # Log detection statistics (FPS, avg time) to the console; nothing is published on ~/statistics
    publish_statistics: true
    
    # Statistics update rate (Hz)
    statistics_update_rate: 1.0
