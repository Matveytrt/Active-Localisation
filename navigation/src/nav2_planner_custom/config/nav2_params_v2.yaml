bt_navigator:
  ros__parameters:
    use_sim_time: True  # Симуляция: время из /clock
    global_frame: map  # Глобальная система координат (должна совпадать с global_costmap)
    robot_base_frame: base_link  # Фрейм базы робота (должен совпадать с costmaps)
    odom_topic: /odom  # Топик одометрии (в симуляции публикует плагин gazebo_ros_planar_move)
    bt_loop_duration: 20  # Период обновления Behavior Tree в миллисекундах (20 мс = 50 Гц)
    # Timeout (milliseconds!) for BT action nodes to get goal acknowledgment from servers.
    # Default is 20 ms — far too short when CPU is busy. 2000 ms = 2 s is safe.
    # Bug: with 30 ms here, Wait/Spin in recovery always timed out before executing.
    default_server_timeout: 2000
    default_planner_id: "GridBased"  # ID планировщика по умолчанию (соответствует Theta* planner)
    # v3: восстановление при потере локализации + быстрый отказ на закрытом
    # проходе. Лестница RoundRobin (клир+выдержка -> Spin 30 град -> глубокий
    # клир), выдержка >= одного периода костмапы после каждого клира, у
    # планировщика нет inline-recovery. Цель обрывается после number_of_retries=3.
    # Разбор — в шапке самого XML.
    # Альтернативы: navigate_to_pose_w_fast_failure.xml (v1) и
    # navigate_to_pose_w_fast_failure_v2.xml (v2) — подставить имя файла сюда.
    # navigation_launch.py берёт отсюда только имя файла и подставляет
    # абсолютный путь к установленному behavior_trees/<имя> (RewrittenYaml):
    # bt_navigator не раскрывает $(find-pkg-share ...) в YAML.
    default_nav_to_pose_bt_xml: /replaced/by/RewrittenYaml/at/launch/navigate_to_pose_w_recovery_v3.xml
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    # 10 Hz: 100 ms budget per MPPI step; with SLAM + lidar on the same CPU
    # 20 Hz misses cycles. Must match MPPI model_dt below.
    controller_frequency: 10.0
    # Must match the lifecycle nodes that publish local/global costmaps (same names as in your bringup)
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    odom_topic: odom
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Tolerate 1 s of continuous MPPI failures before aborting.
    # 0.35 s was too short — startup jitter caused false aborts.
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    path_handler_plugins: ["PathHandler"]
    controller_plugins: ["FollowPath"]

    # true поднимает приоритет MPPI (SCHED_FIFO), но в контейнере это запрещено
    # (ulimit -r = 0): с true контроллер не проходит configure.
    use_realtime_priority: false

    # Progress checker parameters (wider radius: less false "stuck" for holonomic / slow segments)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      # 3 с без продвижения на 0.10 м = нет прогресса: быстрый отказ перед
      # закрытым проходом (входит в расчёт отказа ~10-14 с для BT v2).
      movement_time_allowance: 3.0
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 1.5
      enforce_path_inversion: false
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      # ~3°: робот останавливается у края допуска, поэтому широкий допуск
      # (0.15 рад) даёт систематическую ошибку курса. Доворот занимает < 1 с,
      # progress_checker (3 с) не срабатывает.
      yaw_goal_tolerance: 0.05
    # MPPI controller — заменяет DWB; нативная поддержка омни-кинематики
    # Требует: apt install ros-humble-nav2-mppi-controller (внутри Docker)
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 24          # горизонт: 24 × 0.10 с = 2.4 с (~3 м при 1.25 м/с) — снижено 28→24 для экономии CPU
      model_dt: 0.10          # match controller_frequency: 10 Hz → sequence shifting ON
      batch_size: 1000        # снижено 2000→1000 (дефолт nav2). MPPI в Humble считает на CPU, не на GPU;
                              # ядро MPPI = batch_size × time_steps, поэтому это главный рычаг нагрузки
      vx_std: 0.2
      vy_std: 0.2             # латеральные возмущения — важно для омни
      wz_std: 0.4
      vx_max: 1.0
      vx_min: -1.0
      vy_max: 1.0            # humble: vy ограничена симметрично ±vy_max (vy_min не существует)
      wz_max: 1.0
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"   # humble: "Omni" | "DiffDrive" | "Ackermann"
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0        # повышено (3.81 → 5.0) для тесных коридоров 1.3 м
        critical_cost: 253.0    # LETHAL=254 > 253 → collision_cost; INSCRIBED=253 = 253 → только cost_weight
        consider_footprint: true  # проверяет коллизию по реальному footprint, не по радиусу
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true  # humble: boolean, не mode enum (mode существует только в main)

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0 # экономия CPU: каждый цикл обрабатывает /lidar/points_joined
      publish_frequency: 4.0 # не выше update_frequency: чаще публиковать нечего
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      transform_tolerance: 30.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.325, 0.375], [0.325, -0.375], [-0.325, -0.375], [-0.325, 0.375]]"
      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Градиент-долина для узких проёмов: у робота вписанный радиус ~0.325 м,
        # проём 1.2 м. inflation_radius 0.5 оставляет свободную (cost=0) полосу
        # 1.2-2*0.5=0.2 м по центру, а cost_scaling_factor 3.0 даёт реальный спад
        # к центру (0.03 давал плоское плато ~250 на весь проём -> всё красное,
        # свободной линии нет). 1.3 м коридор тоже проходим (центр 0.65 м > 0.5).
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
        inflate_unknown: false
        inflate_around_unknown: false
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 3
        group_connectivity_type: 4 # 4-связность: диагональные соседи не спасают одиночную точку
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        max_obstacle_height: 1.75
        observation_sources: pointcloud
        pointcloud:
          topic: /lidar/points_joined
          observation_persistence: 0.0
          max_obstacle_height: 1.75
          # Высоты считаются в global_frame костмапы (odom), а не в base_link.
          # В симуляции base_link на z=0.16, пол в odom на z≈0.0 (шум ±0.01):
          # порог 0.05 отсекает пол.
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.45
          inf_is_valid: false
          clearing_on_max_reading: true
      always_send_full_costmap: False # только изменённые области: меньше трафика

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      transform_tolerance: 30.0
      footprint: "[[0.325, 0.375], [0.325, -0.375], [-0.325, -0.375], [-0.325, 0.375]]"
      resolution: 0.05
      track_unknown_space: true
      # obstacle_layer видит препятствия, которых нет на статической карте, —
      # без него планировщик не замечает перекрытый проход. Стоит ДО
      # denoise_layer: порядок критичен, иначе одиночные шумовые точки лидара
      # "запирают" свободные проходы. Карта RTAB-Map (.db) не меняется —
      # костмапа это оверлей в памяти поверх /map.
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /lidar/points_joined
          data_type: "PointCloud2"
          marking: True
          clearing: True
          max_obstacle_height: 1.75
          # Как в local_costmap, но global_frame здесь map (пол тоже на z≈0.0).
          min_obstacle_height: 0.05
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 3
        group_connectivity_type: 4 # как в local_costmap
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Match local costmap: free center strip in a 1.2 m gap + real gradient
        # (see local_costmap inflation_layer note). 0.03/0.6 made the whole gap
        # a flat ~250-cost plateau (all red, no free line).
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: False # как в local_costmap

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 8.0
    use_sim_time: True
    tf_tolerance: 30.0
    wait_for_transform: 10.0
    use_latest_transform: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 0.5   # при 2.0 цели в зоне инфляции (~0.5 м от препятствия) не достигались
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 30.0
    use_sim_time: True
    simulate_ahead_time: 2.0
    # Spin в recovery медленнее лимитов velocity_smoother (1.5 рад/с, 3.0 рад/с²).
    # На этой скорости построен расчёт времени в шапке
    # navigate_to_pose_w_recovery_v3.xml.
    max_rotational_vel: 0.3
    min_rotational_vel: 0.01
    rotational_acc_lim: 0.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 10 # снижено 20->10: частота опроса при следовании по waypoint'ам
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 10.0 # снижено 20->10: всегда-активный таймер, 10 Гц достаточно плавно
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Обновлено: макс скорость 1.25 м/с, ускорение 5 м/с², угловые 1.5 рад/с / 3.0 рад/с²
    max_velocity: [1.25, 1.25, 1.5]
    min_velocity: [-1.25, -1.25, -1.5]
    max_accel: [5.0, 5.0, 3.0]
    max_decel: [-5.0, -5.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
    # Bond heartbeats are a lightweight ~1 Hz timer, but under CPU saturation
    # (SLAM + lidar + STag + MPPI) a server's heartbeat thread can starve for
    # >30 s even though the process is alive. lifecycle_manager then wrongly
    # declares "CRITICAL FAILURE: SERVER ... IS DOWN" and resets the whole
    # Nav2 stack. 0.0 disables the bond timeout check.
    bond_timeout: 0.0
