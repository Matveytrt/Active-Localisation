# Nav2 parameter changes the ACTIVE mode needs on top of
# nav2_planner_custom/config/nav2_params_v2.yaml (baseline stays untouched).
# How it is applied (second params file / RewrittenYaml) is decided with ENG
# in T-009. All values [unverified] in ROS until ENG checks them on Humble.

controller_server:
  ros__parameters:
    FollowPath:
      # Yaw lever: follow the headings written into the path by al_navigator.
      PathAlignCritic:
        use_path_orientations: true
      # These two make the robot face the direction of travel; they fight
      # the chosen headings, so they are off in active mode.
      PathAngleCritic:
        enabled: false
      PreferForwardCritic:
        enabled: false

