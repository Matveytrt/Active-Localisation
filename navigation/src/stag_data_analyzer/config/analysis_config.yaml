# =============================================================================
# Конфигурация для анализа данных STag экспериментов
# =============================================================================

# =============================================================================
# РЕЖИМЫ РАБОТЫ
# =============================================================================
# Можно включить/выключить каждый режим независимо
modes:
  # Индивидуальные heatmap для каждого эксперимента
  # Создает PNG файлы с тепловой картой обнаружений для каждого эксперимента
  individual_heatmaps: true
  
  # Сравнение по размерам маркеров
  # Автоматически находит общие эксперименты между указанными размерами
  compare_by_marker_size: false

# =============================================================================
# ПУТИ К ДАННЫМ
# =============================================================================
paths:
  # Корневая папка с собранными данными
  # Структура: gathered_data/m40/HD17_vert/light_manip/1/logs/*.jsonl
  # Путь на конкретном хосте: замените на свою папку с данными
  gathered_data: "/media/lupasic/Samsung_T54/darkstore_experiment_stag"
  
  # Папка для сохранения результатов анализа
  output_directory: "../../../analysis_results"

# =============================================================================
# РАЗМЕРЫ МАРКЕРОВ
# =============================================================================
marker_sizes:
  - name: "m40"
    display: "40x40 мм"
  - name: "m80"
    display: "80x80 мм"
  - name: "m100"
    display: "100x100 мм"

# =============================================================================
# НАСТРОЙКИ МАРКЕРОВ
# =============================================================================
markers:
  # Общее количество маркеров в сетке
  total_count: 70
  
  # Размеры сетки: 7 рядов × 10 колонок
  rows: 7
  cols: 10
  
  # Примечание: расположение ID маркеров на heatmap
  # - ID 0 → левый нижний угол
  # - ID 9 → правый нижний угол
  # - ID 60 → левый верхний угол
  # - ID 69 → правый верхний угол

# =============================================================================
# НАСТРОЙКИ ВИЗУАЛИЗАЦИИ
# =============================================================================
visualization:
  heatmap:
    # Цветовая схема: Viridis, Plasma, Inferno, Magma, Cividis, Blues, Greens, Reds
    colorscale: "Viridis"
    
    # Показывать значения в ячейках
    show_values: true
    
    # Размеры шрифтов
    title_font_size: 20
    cell_font_size: 10
    
    # Размеры изображения (пиксели)
    width: 1400
    height: 900
  
  # Формат выходных файлов
  output_format: "png"
  
  # Разрешение для PNG
  dpi: 300
  
  # Не читается кодом (зарезервировано).
  display_info:
    - marker_size
    - marker_type
    - experiment_name
    - fps_stats
    - simultaneous_markers_stats

# =============================================================================
# СРАВНИТЕЛЬНЫЙ АНАЛИЗ
# =============================================================================

# Сравнение по размерам маркеров
# Программа автоматически находит общие эксперименты между указанными размерами
marker_size_comparisons:
  # Сравнение 1: HD17 для m40, m80 и m100
  - marker_type: "HD17"              # Тип маркера (папка в gathered_data)
    sizes: ["m40","m80", "m100"]     # Папка HD17 должна быть во всех перечисленных sizes
    # Программа найдет все общие эксперименты между m40/HD17, m80/HD17 и m100/HD17
  
  # Сравнение 2: HD17_vert только для m40 (в других размерах нет этой папки)
  # - marker_type: "HD17_vert"
  #   sizes: ["m40"]  # Только один размер - сравнение не будет создано
  
  # Сравнение 3: HD17_short для m80 (если есть в других размерах)
  # - marker_type: "HD17_short"
  #   sizes: ["m80"]
  
  # Пример 4: Можно указать конкретные эксперименты (опционально)
  # - marker_type: "HD17"
  #   sizes: ["m80", "m100"]
  #   experiments: ["light_manip", "light_slow_center_forward"]  # Только эти эксперименты

# Настройки визуализации для сравнений
comparison_visualization:
  # Типы визуализаций
  visualizations:
    - side_by_side_heatmaps    # Side-by-side тепловые карты
    - metrics_table            # Таблица метрик сравнения
  
  # Форматы выходных файлов
  output_formats:
    - html    # Интерактивный HTML (можно зумить, наводить мышь)
    - png     # Статичное изображение высокого разрешения
    - csv     # CSV таблица с метриками для дальнейшего анализа

# =============================================================================
# ФИЛЬТРАЦИЯ МАРКЕРОВ
# =============================================================================
# Фильтрация не реализована: секция не читается кодом.
filter:
  enabled: false
  mode: "all"

# =============================================================================
# ПРИМЕРЫ ИСПОЛЬЗОВАНИЯ
# =============================================================================
#
# Без --config ищется src/stag_data_analyzer/config/analysis_config.yaml
# относительно текущей папки. --mode переопределяет секцию modes.
#
# 1. Только индивидуальные heatmap:
#    modes:
#      individual_heatmaps: true
#      compare_by_marker_size: false
#    
#    ros2 run stag_data_analyzer analyze_data --config /path/to/analysis_config.yaml
#    (или: ... --mode individual)
#
# 2. Только сравнения по размерам:
#    modes:
#      individual_heatmaps: false
#      compare_by_marker_size: true
#    
#    ros2 run stag_data_analyzer analyze_data --config /path/to/analysis_config.yaml
#    (или: ... --mode comparison)
#
# 3. Всё вместе:
#    modes:
#      individual_heatmaps: true
#      compare_by_marker_size: true
#    
#    ros2 run stag_data_analyzer analyze_data --config /path/to/analysis_config.yaml
#    (или: ... --mode all)
#
# Только сводка по датасету, без вывода файлов:
#    ros2 run stag_data_analyzer analyze_data --config /path/to/analysis_config.yaml --summary-only
#
# 4. Добавить сравнение для нового типа маркера:
#    marker_size_comparisons:
#      - marker_type: "HD17_vert"
#        sizes: ["m40", "m80", "m100"]
#      
#      - marker_type: "HD23_horiz"      # НОВЫЙ ТИП
#        sizes: ["m40", "m80"]
#
# 5. Сравнить только конкретные эксперименты:
#    marker_size_comparisons:
#      - marker_type: "HD17_vert"
#        sizes: ["m40", "m80"]
#        experiments: ["light_manip", "light_diskr_center_forward"]
#
# Примечание: Программа автоматически:
# - Находит общие эксперименты между указанными размерами
# - Для каждого общего эксперимента строит одно сравнение всех перечисленных sizes рядом (side-by-side), без попарных комбинаций
# - Генерирует описания для каждого сравнения
#
# =============================================================================
