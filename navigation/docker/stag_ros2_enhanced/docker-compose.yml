services:
  stag_main_comp:
    image: stag_main_comp

    runtime: nvidia
    restart: always
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/home/app/ros2_ws/src
      - /dev:/dev
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=1
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    devices:
      - /dev/input:/dev/input
      - /dev/video0:/dev/video0
      - /dev/dri:/dev/dri

