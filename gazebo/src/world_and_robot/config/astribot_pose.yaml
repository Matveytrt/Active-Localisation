# Поза Astribot в симуляции.
# rsp.launch.py превращает все подвижные суставы в fixed и "запекает" эти углы в их <origin>.
# Значение-число: угол (рад) вокруг оси сустава из URDF, как в /joint_states.
# Значение {axis, angle}: поворот на angle (рад) вокруг axis, заданной в системе координат сустава.
# Не указанные суставы остаются в нуле.
joint_positions:
  # Плечи чуть прижаты к корпусу (в нуле руки отведены наружу на ~14°)
  astribot_arm_left_joint_2: 0.15
  astribot_arm_right_joint_2: 0.15
  # Ось joint_4 в URDF направлена вдоль предплечья, поэтому локоть разгибается поворотом
  # вокруг поперечной оси. 1.309 рад (75°): рука опущена, в локте лёгкий изгиб 15°.
  astribot_arm_left_joint_4: {axis: [-0.9953, -0.0966, 0.0], angle: 1.309}
  astribot_arm_right_joint_4: {axis: [0.9953, 0.0966, 0.0], angle: 1.309}
