joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1 # ось вперёд-назад (обычно левый стик вертикаль)
      y: 0 # ось влево-вправо (стрейф, обычно левый стик горизонталь)
    scale_linear:
      x: 0.5
      y: 0.5
    scale_linear_turbo:
      x: 1.0
      y: 1.0

    axis_angular:
      yaw: 3 # поворот на месте (обычно правый стик горизонталь)
    scale_angular:
      yaw: 0.5
    scale_angular_turbo:
      yaw: 1.0

    enable_button: 4 # например, LT
    enable_turbo_button: 5 # например, RT

    require_enable_button: true
