services:
  gazebo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_VER: humble
        APP_UID: ${UID:-1000}
    image: active-localization-gazebo:latest
    container_name: gazebo
    # runtime: nvidia  # Раскомментируйте, если установлен nvidia-container-toolkit и нужна поддержка GPU
    restart: unless-stopped
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/home/app/ros2_ws/src:rw
      - /dev:/dev
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Раскомментируйте следующие строки, если есть GPU и nvidia-container-toolkit:
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,utility,display
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Только UDP: shared memory Fast DDS не работает между разными контейнерами
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      # Онлайн-база models.gazebosim.org не отвечает, и gzserver зависает на загрузке мира; все модели локальные
      - GAZEBO_MODEL_DATABASE_URI=
      - GAZEBO_MODEL_PATH=/home/app/ros2_ws/install/world_and_robot/share/world_and_robot/gazebo_objects:/usr/share/gazebo-11/models:/opt/ros/humble/share/gazebo_models/models:${GAZEBO_MODEL_PATH:-}
    devices:
      - /dev/input:/dev/input
      #- /dev/video0:/dev/video0
      # Аппаратный рендеринг через Mesa (AMD/Intel): запуск с software_rendering:=false
      - /dev/dri:/dev/dri
    # GID групп video и render на хосте (getent group video render)
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-110}"
    stdin_open: true
    tty: true
