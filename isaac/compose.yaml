name: al-isaac
x-ros-common: &ros-common
    image: al-isaac-navigation:humble
    network_mode: host
    user: "1005:1005"
    environment: &ros-environment
      HOME: /workspace
      ROS_DOMAIN_ID: "71"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      FASTRTPS_DEFAULT_PROFILES_FILE: /repo/isaac/fastdds.xml
    volumes:
      - ../:/repo:ro
      - ./runtime/navigation:/workspace:rw
    working_dir: /workspace
services:
  navigation:
    <<: *ros-common
    build:
      context: .
      dockerfile: Dockerfile.navigation
    container_name: al-isaac-navigation
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
  odom-noise:
    <<: *ros-common
    container_name: al-isaac-odom-noise
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && exec python3 /repo/isaac/nav_support.py --ros-args --params-file /repo/navigation/src/al_odom_noise/config/odom_noise.yaml"]
  lidar-stitching:
    <<: *ros-common
    container_name: al-isaac-lidar-stitching
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && exec ros2 run lidar_stitching lidar_stitching_node --ros-args --params-file /repo/gazebo/src/lidar_stitching/config/lidar_stitching_params.yaml -p use_sim_time:=true"]
  stag-hd17:
    <<: *ros-common
    profiles: [world]
    container_name: al-isaac-stag-hd17
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && exec python3 /repo/isaac/run_stag.py HD17"]
  stag-hd15:
    <<: *ros-common
    profiles: [world]
    container_name: al-isaac-stag-hd15
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && exec python3 /repo/isaac/run_stag.py HD15"]
  fiducial:
    <<: *ros-common
    profiles: [slam]
    container_name: al-isaac-fiducial
    environment:
      <<: *ros-environment
      AL_ISAAC_SLAM_MODE: ${AL_ISAAC_SLAM_MODE:-mapping}
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && exec python3 /repo/isaac/run_slam.py fiducial"]
  slam:
    <<: *ros-common
    profiles: [slam]
    container_name: al-isaac-slam
    stop_grace_period: 120s
    environment:
      <<: *ros-environment
      AL_ISAAC_SLAM_MODE: ${AL_ISAAC_SLAM_MODE:-mapping}
      AL_ISAAC_DB: ${AL_ISAAC_DB:-/workspace/maps/isaac.db}
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && exec python3 /repo/isaac/run_slam.py slam"]
  baseline:
    <<: *ros-common
    profiles: [nav]
    container_name: al-isaac-baseline
    stop_signal: SIGINT
    stop_grace_period: 30s
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && exec python3 /repo/isaac/run_slam.py baseline"]
